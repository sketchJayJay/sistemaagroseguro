{% extends 'base.html' %}{% from 'ui.html' import icon %}{% block content %}<span class="eyebrow">LANÇAMENTO MANUAL</span><h1>Editar lançamento</h1><p class="subtitle">Atualize os dados do registro financeiro.</p><div class="card"><form method="post" class="form"><div><label>Data</label><input type="date" name="data" value="{{ item.data }}" required></div><div><label>Tipo</label><select name="tipo">{% for t in ['Entrada','Saída'] %}<option {% if item.tipo==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div><div><label>Valor (R$)</label><input type="number" step="0.01" min="0.01" name="valor" value="{{ item.valor }}" required></div><div><label>Situação</label><select name="status">{% for s in ['Pendente','Pago','Recebido'] %}<option {% if item.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="span"><label>Descrição</label><input name="descricao" value="{{ item.descricao }}" required></div><div class="span"><label>Categoria</label><input name="categoria" value="{{ item.categoria or '' }}"></div><div class="form-footer"><a class="btn light" href="{{ url_for('financeiro') }}">Voltar</a><button class="btn">{{ icon('check') }} Salvar alterações</button></div></form></div>{% endblock %}
